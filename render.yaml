services:
  - type: web
    name: plagiarism-detector
    runtime: python
    buildCommand: "gcc -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -std=c11 -Iinclude -o plagiarism_detector src/*.c && pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
